name: Windows installer
on:
  push:
    branches: [main]
    paths:
      - 'ai_event_editor/**'
      - 'premiere-plugin/**'
      - 'packaging/windows/**'
      - '.github/workflows/windows-installer.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install -e . "pyinstaller>=6.10,<7"
      - name: Build engine, Adobe package and installer
        run: python packaging/windows/package.py
      - name: Install and exercise the packaged engine
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/installer/*.exe | Select-Object -First 1).FullName
          $installedApp = Join-Path $env:RUNNER_TEMP 'AI Event Editor Installed'
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$installedApp`"") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          python packaging/windows/smoke_test.py "$installedApp"
      - name: Verify real CLIP CPU add-on in installed edition
        shell: pwsh
        run: python packaging/windows/smoke_ai.py "$env:RUNNER_TEMP/AI Event Editor Installed"
      - name: Publish downloadable installer
        uses: actions/upload-artifact@v4
        with:
          name: AI-Event-Editor-AI-Installer
          path: |
            dist/download/*
          if-no-files-found: error
          retention-days: 30
      - name: Collect build diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          $diagnostics = 'dist/diagnostics'
          New-Item -ItemType Directory -Force -Path $diagnostics | Out-Null
          $warningFile = 'build/AIEventEngine/warn-AIEventEngine.txt'
          $engineLog = Join-Path $env:LOCALAPPDATA 'AIEventEditor/engine.log'
          if (Test-Path $warningFile) { Copy-Item $warningFile $diagnostics }
          if (Test-Path $engineLog) { Copy-Item $engineLog $diagnostics }
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-installer-diagnostics
          path: dist/diagnostics/*
          if-no-files-found: ignore
