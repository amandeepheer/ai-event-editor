name: Python unit tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg for real video render tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Show runtime versions
        run: |
          python --version
          ffmpeg -version | head -n 2
      - name: Install project and tests
        run: python -m pip install -e '.[test]'
      - name: Run tests with full failure details
        run: |
          set -o pipefail
          python -m pytest -ra -vv --tb=long 2>&1 | tee pytest-output.log
      - name: Upload test failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failure-report
          path: pytest-output.log
          if-no-files-found: ignore
          retention-days: 7
