[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "ai-event-editor"
version = "0.5.1"
requires-python = ">=3.10"
[project.optional-dependencies]
media = ["librosa>=0.10,<1", "numpy>=1.26,<3"]
test = ["pytest>=8,<10"]
vision = ["torch>=2.2", "transformers>=4.40,<5", "pillow>=10"]
[project.scripts]
ai-event-editor = "ai_event_editor.cli:main"
ai-event-editor-desktop = "ai_event_editor.guided:main"
ai-event-editor-engine = "ai_event_editor.service:main"
[tool.setuptools.packages.find]
include = ["ai_event_editor*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
