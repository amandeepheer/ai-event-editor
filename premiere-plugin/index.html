<!doctype html><html><head><meta charset="utf-8"><title>AI Event Editor</title><link rel="stylesheet" href="style.css"></head><body><main><h1>AI Event Editor</h1><p>Premiere Pro companion · local-first</p><fieldset id="duration-settings"><legend>Video duration</legend><label for="duration-preset">Duration</label><select id="duration-preset"><option value="30">30 sec</option><option value="60" selected>1 min</option><option value="120">2 min</option><option value="300">5 min</option><option value="custom">Custom</option><option value="auto">Auto (suggested)</option></select><div id="custom-duration" hidden><label for="custom-seconds">Custom duration (seconds, 30–300)</label><input id="custom-seconds" type="number" min="30" max="300" step="1" value="90"></div><p id="duration-summary" aria-live="polite">Selected: 1:00</p></fieldset><label>Editing instruction<textarea id="instruction" rows="3" placeholder="Make a cinematic 60-second recap with elegant titles"></textarea></label><label>AI edit plan JSON<textarea id="plan" rows="9" placeholder="Paste your edit-plan.json here"></textarea></label><div class="actions"><button id="validate">Validate plan</button><button id="inspect">Inspect Premiere</button></div><pre id="status" role="status">Ready. No changes will be made without confirmation.</pre></main><script src="main.js"></script></body></html>
